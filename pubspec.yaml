name: train_ledger
description: "铁道运转记录程序 - 面向硬核铁道迷的专业级运转记录账本"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.3.1
  flex_color_scheme: ^8.4.0
  json_annotation: ^4.9.0
  freezed_annotation: ^3.1.0
  objectbox: ^5.2.0
  objectbox_flutter_libs: ^5.2.0
  path_provider: ^2.1.0
  flutter_slidable: ^4.0.0
  dynamic_color: ^1.7.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  freezed: ^3.2.5
  json_serializable: ^6.8.0
  build_runner: ^2.4.0
  objectbox_generator: ^5.2.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
